[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jumyo"
version = "0.2.0"
description = "A personal longevity team of Claude agents with a deterministic health-record toolbelt"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2", "PyYAML", "matplotlib>=3.8"]

[project.optional-dependencies]
clocks = ["biolearn>=0.9,<1", "pandas>=2.1,<3", "seaborn"]
dev = ["pytest>=8"]
pdf = ["matplotlib>=3.8"]

[project.scripts]
jumyo = "jumyo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jumyo = ["report.html", "map/data/*.csv", "map/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: needs real network access (deselected by default)",
    "clocks: needs the clocks extra (biolearn)",
]
